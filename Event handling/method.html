<body>
    <button id="myButton">Click me!</button>
    <script>
        let button = document.getElementById
        ("myButton");

        // event handler pertama untuk di click
        button.addEventListener("click", function (){
        console.log('Event handler pertama');});

        //event handler kedua untuk di click 
        button.addEventListener("click", function (){
        console.log('Event handler kedua');});
        
    </script>
</body>
