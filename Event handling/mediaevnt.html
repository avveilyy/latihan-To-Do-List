<!DOCTYPE html>
<html lang="en">
<head>

    <title>Contoh Media Event</title>

</head>
<body>

    <audio id="myAudio" controls>
        <source src="example.mp3" type="audio/mp3">Your browser does not support the audio
    </audio>

    <script>
        const audioElement = document.getElementById("myAudio");
        audioElement.addEventListener("play", function (){
            console.log("Audio dimulai atau dilanjutkan pemutaran ");
        });
    </script>
    
</body>
</html>
