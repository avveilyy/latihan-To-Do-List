<!-- event handler properties, hal 216 -->
 <body>
    <button id="myButton">Click me!</button>
    <script>
        //mengakses elemen tombol dengan ID "myButton"
        let button = document.getElementById
        ("myButton");

        //menetapkan fungsi penanganan event untuk properti onclick
        button.onclick = function () {
            alert ('Button clicked!');
        };
    </script>
 </body>
